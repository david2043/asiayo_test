apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: <NAMESPACE>

  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: terraform-k8s

spec:
  serviceName: mysql-headless

  replicas: <MYSQL_REPLICA_COUNT>

  podManagementPolicy: OrderedReady

  selector:
    matchLabels:
      app.kubernetes.io/name: mysql

  updateStrategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: terraform-k8s

    spec:
      terminationGracePeriodSeconds: 60

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100

              podAffinityTerm:
                topologyKey: kubernetes.io/hostname

                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mysql

      initContainers:
        - name: mysql-init

          image: <MYSQL_IMAGE>:<MYSQL_IMAGE_TAG>

          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c
            - |
              set -eu

              ordinal="${HOSTNAME##*-}"

              mkdir -p /mnt/conf.d

              if [ "${ordinal}" = "0" ]; then
                cp /config/primary.cnf /mnt/conf.d/server.cnf
              else
                cp /config/replica.cnf /mnt/conf.d/server.cnf
              fi

          volumeMounts:
            - name: mysql-config

              mountPath: /config

            - name: mysql-config-runtime

              mountPath: /mnt/conf.d\

      containers:
        - name: mysql

          image: <MYSQL_IMAGE>:<MYSQL_IMAGE_TAG>

          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: <MYSQL_PORT>

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

            - name: MYSQL_REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_REPLICATION_USER

            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_REPLICATION_PASSWORD

          resources:
            requests:
              cpu: <MYSQL_REQUEST_CPU>
              memory: <MYSQL_REQUEST_MEMORY>

            limits:
              cpu: <MYSQL_LIMIT_CPU>
              memory: <MYSQL_LIMIT_MEMORY>

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

            - name: mysql-config-runtime
              mountPath: /etc/mysql/conf.d
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}"

            periodSeconds: <STARTUP_PROBE_PERIOD>

            failureThreshold: <STARTUP_PROBE_FAILURE_THRESHOLD>

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}"

            initialDelaySeconds: <READINESS_INITIAL_DELAY>

            periodSeconds: <READINESS_PERIOD>

            timeoutSeconds: 5

            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}"

            initialDelaySeconds: <LIVENESS_INITIAL_DELAY>

            periodSeconds: <LIVENESS_PERIOD>

            timeoutSeconds: 5

            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - mysqladmin shutdown -uroot -p"${MYSQL_ROOT_PASSWORD}"

      volumes:
        - name: mysql-config
          configMap:
            name: mysql-config

        - name: mysql-config-runtime
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: mysql-data

        labels:
          app.kubernetes.io/name: mysql
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: terraform-k8s

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: <STORAGE_CLASS>

        resources:
          requests:
            storage: <MYSQL_STORAGE_SIZE>
